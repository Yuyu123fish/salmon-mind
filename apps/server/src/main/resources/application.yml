server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

# 本地代码库只读底座：路径按 Server 所在机器解释；修改后需重启 Server。
codebase:
  git-command: ${CODEBASE_GIT_COMMAND:git}
  git-timeout: ${CODEBASE_GIT_TIMEOUT:10s}

spring:
  application:
    name: salmon-mind-server
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  main:
    keep-alive: ${SPRING_MAIN_KEEP_ALIVE:true}
  # 未显式指定 profile 时默认 dev：本地开发加载 config/application-dev.yml（不入库）。
  # 生产/容器部署用环境变量注入敏感配置，或在启动命令显式指定 profile。
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/salmon_mind}
    # 账号密码属于敏感配置：本地开发由 config/application-dev.yml 提供，容器由环境变量提供
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE:52428800}
      max-request-size: ${KNOWLEDGE_MAX_REQUEST_SIZE:53477376}
  flyway:
    locations: classpath:db/migration/workspace,classpath:db/migration/knowledge,classpath:db/migration/conversation
  modulith:
    detection-strategy: explicitly-annotated

mybatis-plus:
  type-handlers-package: com.yuyu.salmonmind.persistence.mybatis
  configuration:
    map-underscore-to-camel-case: true
    # PostgreSQL 不能把 JDBC NULL 按 VARCHAR 绑定
    jdbc-type-for-null: other
  global-config:
    banner: false
    db-config:
      id-type: none
      schema: public

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

salmon:
  # 唯一 Server-owned 使用数据根。未设置时从启动目录向上定位项目根并使用 data/。
  data-dir: ${SALMON_DATA_DIR:__SALMON_DATA_DIR_UNSET__}
  model:
    connect-timeout: ${MODEL_CONNECT_TIMEOUT:5s}
    read-timeout: ${MODEL_READ_TIMEOUT:60s}
    chat:
      # base-url 与 model-name 是不敏感的提供方约定；api-key 属敏感配置，由 dev profile 或环境变量提供
      base-url: ${MODEL_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${MODEL_CHAT_API_KEY:}
      model-name: ${MODEL_CHAT_NAME:deepseek-v4-flash}
    embedding:
      base-url: ${MODEL_EMBEDDING_BASE_URL:}
      api-key: ${MODEL_EMBEDDING_API_KEY:}
      # Stage 02 固定模型与维数；未配置 base-url/key 时仍只在 Worker 使用时失败
      model-name: ${MODEL_EMBEDDING_NAME:Qwen/Qwen3-Embedding-4B}
    rerank:
      base-url: ${MODEL_RERANK_BASE_URL:}
      api-key: ${MODEL_RERANK_API_KEY:}
      model-name: ${MODEL_RERANK_NAME:Qwen/Qwen3-Reranker-4B}
      instruction: ${MODEL_RERANK_INSTRUCTION:rerank-v1}
  agent:
    # ReactAgent 公开的 ModelCallLimitHook 硬步数上限；不是模型自觉停止的提示。
    max-steps: ${AGENT_MAX_STEPS:32}
    checkpoint:
      # meta/reverse/content/leaf 共享的滑动 Lease；执行期 lock 不在此范围内。
      ttl: ${AGENT_CHECKPOINT_TTL:24h}
      cleanup-max-attempts: ${AGENT_CHECKPOINT_CLEANUP_MAX_ATTEMPTS:3}
    continuation:
      max-auto-attempts: ${AGENT_CONTINUATION_MAX_AUTO_ATTEMPTS:2}
      max-cumulative-output-tokens: ${AGENT_CONTINUATION_MAX_OUTPUT_TOKENS:131072}
      timeout: ${AGENT_CONTINUATION_TIMEOUT:120s}
    parallel:
      max-concurrent-tools: ${AGENT_MAX_CONCURRENT_TOOLS:2}
      max-concurrent-per-web-provider: ${AGENT_MAX_CONCURRENT_PER_WEB_PROVIDER:1}
      tool-execution-timeout: ${AGENT_TOOL_EXECUTION_TIMEOUT:60s}
    max-tool-result-chars: ${AGENT_MAX_TOOL_RESULT_CHARS:200000}
    max-tool-calls-per-run: ${AGENT_MAX_TOOL_CALLS_PER_RUN:4}
    codebase:
      # 本地代码库工具独立调用/字符预算；结果 token 由下一次模型输入实际计量。
      max-tool-calls-per-run: ${SALMON_AGENT_CODEBASE_MAX_TOOL_CALLS_PER_RUN:16}
      max-tool-result-chars: ${SALMON_AGENT_CODEBASE_MAX_TOOL_RESULT_CHARS:65536}
    trace:
      # 展示/持久化硬上限，不是模型 Token Budget；部署只能下调，代码不会允许突破固定边界。
      max-items: ${AGENT_TRACE_MAX_ITEMS:64}
      max-reasoning-chars: ${AGENT_TRACE_MAX_REASONING_CHARS:32768}
      max-tool-summary-chars: ${AGENT_TRACE_MAX_TOOL_SUMMARY_CHARS:512}
  websearch:
    connect-timeout: ${WEB_SEARCH_CONNECT_TIMEOUT:5s}
    read-timeout: ${WEB_SEARCH_READ_TIMEOUT:15s}
    search-api:
      base-url: ${SEARCH_API_BASE_URL:https://www.searchapi.io}
      api-key: ${SEARCH_API_API_KEY:}
      gl: ${SEARCH_API_GL:cn}
      hl: ${SEARCH_API_HL:zh-cn}
      safe: ${SEARCH_API_SAFE:active}
  redis:
    # ReactAgent Checkpoint 的短期状态存储；未配置时应用仍可启动，进入对话调用才报错
    url: ${REDIS_URL:redis://127.0.0.1:6379}
    password: ${REDIS_PASSWORD:}
  compaction:
    # 运行时上下文压缩预算：物理窗口、主输入触发阈值、输出预留和 Tail 相互独立。
    physical-window: ${COMPACTION_PHYSICAL_WINDOW:1000000}
    trigger-input-tokens: ${COMPACTION_TRIGGER_INPUT_TOKENS:700000}
    output-reserve: ${COMPACTION_OUTPUT_RESERVE:65432}
    retained-tail-target: ${COMPACTION_RETAINED_TAIL_TARGET:65536}
    summary-max-output-tokens: ${COMPACTION_SUMMARY_MAX_OUTPUT_TOKENS:32768}
    summary-temperature: ${COMPACTION_SUMMARY_TEMPERATURE:0.1}
    # Agent 报告的实际 system/tool schema 开销下限；256 不是完整 system/tool token 数
    system-prompt-tokens: ${COMPACTION_SYSTEM_PROMPT_TOKENS:256}
  conversation:
    # 权威会话历史由 ServerDataRoot 派生为 <salmon.data-dir>/conversations
    cache:
      # Redis 只保存可丢弃的完整快照；关闭后完全回退 JSONL，不触碰 Redis
      enabled: ${CONVERSATION_CACHE_ENABLED:true}
      ttl: ${CONVERSATION_CACHE_TTL:10m}
      max-entry-bytes: ${CONVERSATION_CACHE_MAX_ENTRY_BYTES:4194304}
      key-prefix: ${CONVERSATION_CACHE_KEY_PREFIX:salmon:conversation:snapshot:v1:}
  knowledge:
    chunk-max-chars: ${KNOWLEDGE_CHUNK_MAX_CHARS:1200}
    embedding-batch-size: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:32}
    max-object-bytes: ${KNOWLEDGE_MAX_OBJECT_BYTES:52428800}
    upload:
      resumable-enabled: ${KNOWLEDGE_RESUMABLE_UPLOAD_ENABLED:true}
      resumable-threshold-bytes: ${KNOWLEDGE_RESUMABLE_UPLOAD_THRESHOLD_BYTES:10485760}
      part-size-bytes: ${KNOWLEDGE_UPLOAD_PART_SIZE_BYTES:5242880}
      max-concurrent-parts: ${KNOWLEDGE_UPLOAD_MAX_CONCURRENT_PARTS:3}
      session-idle-ttl: ${KNOWLEDGE_UPLOAD_SESSION_IDLE_TTL:30m}
      max-session-lifetime: ${KNOWLEDGE_UPLOAD_MAX_SESSION_LIFETIME:24h}
      orphan-grace: ${KNOWLEDGE_UPLOAD_ORPHAN_GRACE:2h}
      terminal-retention: ${KNOWLEDGE_UPLOAD_TERMINAL_RETENTION:1h}
      cleanup-interval: ${KNOWLEDGE_UPLOAD_CLEANUP_INTERVAL:1m}
      cleanup-batch-size: ${KNOWLEDGE_UPLOAD_CLEANUP_BATCH_SIZE:100}
      key-prefix: ${KNOWLEDGE_UPLOAD_KEY_PREFIX:salmon:knowledge:upload:v1:}
      api-call-timeout: ${KNOWLEDGE_UPLOAD_API_CALL_TIMEOUT:15s}
      api-attempt-timeout: ${KNOWLEDGE_UPLOAD_API_ATTEMPT_TIMEOUT:10s}
    default-top-k: ${KNOWLEDGE_DEFAULT_TOP_K:5}
    max-top-k: ${KNOWLEDGE_MAX_TOP_K:20}
    queue:
      stream: ${KNOWLEDGE_QUEUE_STREAM:salmon:knowledge:ingestion}
      group: ${KNOWLEDGE_QUEUE_GROUP:salmon-knowledge-workers}
    worker:
      enabled: ${KNOWLEDGE_WORKER_ENABLED:true}
      batch-size: ${KNOWLEDGE_WORKER_BATCH_SIZE:4}
      max-auto-retries: ${KNOWLEDGE_WORKER_MAX_AUTO_RETRIES:2}
      cleanup-max-attempts: ${KNOWLEDGE_WORKER_CLEANUP_MAX_ATTEMPTS:3}
      cleanup-interval: ${KNOWLEDGE_WORKER_CLEANUP_INTERVAL:30s}
      cleanup-batch-size: ${KNOWLEDGE_WORKER_CLEANUP_BATCH_SIZE:64}
      reclaim-idle: ${KNOWLEDGE_WORKER_RECLAIM_IDLE:30s}
      repair-interval: ${KNOWLEDGE_WORKER_REPAIR_INTERVAL:10s}
    content-store:
      endpoint: ${RUSTFS_ENDPOINT:}
      access-key: ${RUSTFS_ACCESS_KEY:}
      secret-key: ${RUSTFS_SECRET_KEY:}
      bucket: ${RUSTFS_BUCKET_KNOWLEDGE:salmon-knowledge}
      region: ${RUSTFS_REGION:us-east-1}
    search:
      base-url: ${ELASTICSEARCH_URL:}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      index-prefix: ${KNOWLEDGE_INDEX_PREFIX:salmon-evidence}
      shards: ${KNOWLEDGE_INDEX_SHARDS:1}
      replicas: ${KNOWLEDGE_INDEX_REPLICAS:0}
      connect-timeout: ${KNOWLEDGE_SEARCH_CONNECT_TIMEOUT:5s}
      read-timeout: ${KNOWLEDGE_SEARCH_READ_TIMEOUT:30s}
      max-revision-filter: ${KNOWLEDGE_MAX_REVISION_FILTER:512}
      vector-num-candidates: ${KNOWLEDGE_VECTOR_NUM_CANDIDATES:200}
