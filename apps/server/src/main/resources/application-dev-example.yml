# 本地开发配置模板：复制为 application-dev.yml 并填写真实值。
# application-dev.yml 已被 .gitignore 忽略，不会入库；本模板文件随仓库维护。
# 运行 `mvn spring-boot:run` 时默认激活 dev profile，自动加载本文件。
spring:
  threads:
    # Java 21 虚拟线程默认开启；修改后需重启 Server，关闭可回退平台线程
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    username: salmon_mind
    password: salmon_mind_local

# 本地代码库只读底座配置；目标仓库不会被写入。修改后需重启 Server。
codebase:
  git-command: git
  git-timeout: 10s

salmon:
  # 可选：使用绝对路径覆盖项目根 data/；修改后需重启 Server。
  # data-dir: D:/salmon-mind-data
  model:
    chat:
      # OpenAI-compatible API key；base-url 与 model-name 保留在 application.yml 的非敏感默认值中
      api-key: your-chat-api-key
    embedding:
      # SiliconFlow OpenAI-compatible API 根路径；代码会追加 /embeddings
      base-url: https://api.siliconflow.cn/v1
      api-key: your-embedding-api-key
    rerank:
      # SiliconFlow API 根路径；代码会追加 /rerank
      base-url: https://api.siliconflow.cn/v1
      api-key: your-rerank-api-key
  websearch:
    bocha:
      # 原始 Web Search API；缺少 key 时服务仍可启动，调用网页工具时返回未配置
      base-url: https://api.bochaai.com
      api-key: your-bocha-api-key
    search-api:
      # SearchApi.io Google organic results；不在浏览器或 query 参数中保存 key
      base-url: https://www.searchapi.io
      api-key: your-searchapi-api-key
      gl: cn
      hl: zh-cn
      safe: active
  agent:
    # 可选：Checkpoint 四类 Key 的滑动 Lease，默认 24h，修改后重启后端生效
    checkpoint:
      ttl: 24h
      cleanup-max-attempts: 3
    continuation:
      max-auto-attempts: 2
      max-cumulative-output-tokens: 131072
      timeout: 120s
    parallel:
      max-concurrent-tools: 2
      max-concurrent-per-web-provider: 1
      tool-execution-timeout: 60s
    # 可选：一次主调用内所有工具结果的累计 token 上限；默认 32768，修改后重启后端生效
    max-tool-result-tokens-per-run: 32768
    codebase:
      # 可选：本地代码库工具独立预算；默认值可下调，修改后重启后端生效
      max-tool-calls-per-run: 16
      max-tool-result-tokens-per-run: 65536
      max-tool-result-chars: 65536
    # 可选：一次 Agent Loop 的模型调用硬上限；默认 32，修改后重启后端生效
    max-steps: 32
  redis:
    # 本地 Redis 无密码时留空
    password:
  conversation:
    # Conversation 目录由唯一 salmon.data-dir 派生，不要再配置独立 data-dir。
    cache:
      # 可选：Redis 快照缓存默认开启；Redis 不可用时自动回退 JSONL
      enabled: true
      ttl: 10m
      max-entry-bytes: 4194304
      key-prefix: salmon:conversation:snapshot:v1:
  knowledge:
    upload:
      # 大文件可恢复上传；修改阈值/生命周期/超时后需重启 Server，Redis 与 RustFS 必须可用
      resumable-enabled: true
      resumable-threshold-bytes: 10485760
      part-size-bytes: 5242880
      max-concurrent-parts: 3
      session-idle-ttl: 30m
      max-session-lifetime: 24h
      orphan-grace: 2h
      terminal-retention: 1h
      cleanup-interval: 1m
      cleanup-batch-size: 100
      key-prefix: salmon:knowledge:upload:v1:
      api-call-timeout: 15s
      api-attempt-timeout: 10s
    content-store:
      # 宿主机运行后端时，访问 Compose 映射到本机的 RustFS API 端口
      endpoint: http://127.0.0.1:9000
      access-key: salmonmind
      secret-key: salmonmind-local-change-me
    worker:
      cleanup-max-attempts: 3
      cleanup-interval: 30s
      cleanup-batch-size: 64
      bucket: salmon-knowledge
      region: us-east-1
    search:
      # 宿主机运行后端时访问 Compose 映射到本机的 Elasticsearch
      base-url: http://127.0.0.1:9200
      username:
      password:
