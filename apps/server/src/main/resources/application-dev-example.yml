# 本地开发配置模板：复制为 application-dev.yml 并填写真实值。
# application-dev.yml 已被 .gitignore 忽略，不会入库；本模板文件随仓库维护。
# 运行 `mvn spring-boot:run` 时默认激活 dev profile，自动加载本文件。
spring:
  datasource:
    username: salmon_mind
    password: salmon_mind_local

salmon:
  model:
    chat:
      # OpenAI-compatible API key；base-url 与 model-name 保留在 application.yml 的非敏感默认值中
      api-key: your-chat-api-key
    embedding:
      # SiliconFlow OpenAI-compatible API 根路径；代码会追加 /embeddings
      base-url: https://api.siliconflow.cn/v1
      api-key: your-embedding-api-key
    rerank:
      # SiliconFlow API 根路径；代码会追加 /rerank
      base-url: https://api.siliconflow.cn/v1
      api-key: your-rerank-api-key
  websearch:
    bocha:
      # 原始 Web Search API；缺少 key 时服务仍可启动，调用网页工具时返回未配置
      base-url: https://api.bochaai.com
      api-key: your-bocha-api-key
    search-api:
      # SearchApi.io Google organic results；不在浏览器或 query 参数中保存 key
      base-url: https://www.searchapi.io
      api-key: your-searchapi-api-key
      gl: cn
      hl: zh-cn
      safe: active
  agent:
    # 可选：一次主调用内所有工具结果的累计 token 上限；默认 32768，修改后重启后端生效
    max-tool-result-tokens-per-run: 32768
    # 可选：一次 Agent Loop 的模型调用硬上限；默认 32，修改后重启后端生效
    max-steps: 32
  redis:
    # 本地 Redis 无密码时留空
    password:
  knowledge:
    content-store:
      # 宿主机运行后端时，访问 Compose 映射到本机的 RustFS API 端口
      endpoint: http://127.0.0.1:9000
      access-key: salmonmind
      secret-key: salmonmind-local-change-me
      bucket: salmon-knowledge
      region: us-east-1
    search:
      # 宿主机运行后端时访问 Compose 映射到本机的 Elasticsearch
      base-url: http://127.0.0.1:9200
      username:
      password:
